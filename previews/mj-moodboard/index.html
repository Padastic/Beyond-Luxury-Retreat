<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palaiochora Protocol — MJ Moodboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0d0d0d;color:#ccc;padding:20px}
h1{text-align:center;font-size:1.5rem;font-weight:300;margin:20px 0 10px;color:#b89c8a;letter-spacing:0.04em}
.stats{text-align:center;margin-bottom:30px;font-size:0.85rem;color:#666}
.shot-row{margin-bottom:40px;border-bottom:1px solid #1a1a1a;padding-bottom:20px}
.shot-label{font-size:0.75rem;color:#b89c8a;letter-spacing:0.06em;margin-bottom:10px;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid img{width:100%;height:auto;border-radius:4px;transition:transform 0.2s;cursor:pointer}
.grid img:hover{transform:scale(1.02)}
.lightbox{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:999;justify-content:center;align-items:center}
.lightbox.active{display:flex}
.lightbox img{max-width:95vw;max-height:95vh;object-fit:contain;border-radius:4px}
.lightbox .close{position:absolute;top:20px;right:30px;color:#fff;font-size:2rem;cursor:pointer;z-index:1000}
.lightbox .counter{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:#888;font-size:0.8rem}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}h1{font-size:1.1rem}}
</style>
</head>
