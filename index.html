<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Script Breakdown ,  Το Πρωτόκολλο της Παλαιόχωρας</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Outfit', 'Inter', -apple-system, sans-serif;
  background: linear-gradient(135deg, #3a2f28 0%, #5a4a3a 40%, #7a6a55 70%, #b89c8a 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  overflow: hidden;
  position: relative;
}

body::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 30% 80%, rgba(196,163,90,0.12) 0%, transparent 60%),
              radial-gradient(ellipse at 70% 20%, rgba(122,159,181,0.08) 0%, transparent 50%);
}

.content {
  position: relative;
  z-index: 1;
  padding: 40px 24px;
  max-width: 640px;
  animation: fadeUp 1.2s ease-out;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}

.logo {
  width: 90px;
  height: auto;
  margin-bottom: 48px;
  opacity: 0.85;
}

h1 {
  font-size: clamp(2.4rem, 7vw, 5rem);
  font-weight: 300;
  color: #ffffff;
  letter-spacing: -0.02em;
  margin-bottom: 12px;
  line-height: 1.1;
}
h1 span { font-weight: 600; }

.subtitle {
  font-size: 1.3rem;
  color: #d4c5b9;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 400;
  margin-bottom: 56px;
}

.meta {
  display: flex;
  gap: 36px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 56px;
}

.meta-item {
  color: #ffffff;
  opacity: 0.75;
  font-size: 1rem;
  letter-spacing: 0.04em;
}
.meta-item strong {
  display: block;
  font-size: 1.35rem;
  font-weight: 500;
  opacity: 1;
  margin-bottom: 2px;
}

.btn {
  display: inline-block;
  padding: 14px 48px;
  border: 1px solid rgba(255,255,255,0.4);
  border-radius: 40px;
  color: #ffffff;
  font-size: 1rem;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  text-decoration: none;
  transition: all 0.35s ease;
  backdrop-filter: blur(4px);
}

.btn:hover {
  background: rgba(255,255,255,0.12);
  border-color: rgba(255,255,255,0.7);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.15);
}

.footer-note {
  position: absolute;
  bottom: 32px;
  left: 0; right: 0;
  text-align: center;
  font-size: 0.8rem;
  color: rgba(255,255,255,0.4);
  letter-spacing: 0.05em;
}
</style>
</head>
<body>

<div class="content">
  <img class="logo" src="assets/beyond-logo.svg" alt="Beyond Luxury Retreat" style="filter: brightness(10);">

  <h1>Script <span>Breakdown</span></h1>
  <p class="subtitle">«Το Πρωτόκολλο της Παλαιόχωρας»</p>

  <div class="meta">
    <div class="meta-item"><strong>8</strong> σελίδες</div>
    <div class="meta-item"><strong>16</strong> σκηνές</div>
    <div class="meta-item"><strong>7</strong> ρόλοι</div>
    <div class="meta-item"><strong>5</strong> ημέρες</div>
  </div>

  <a href="script.html" class="btn">Είσοδος</a>
</div>

<div class="footer-note">Beyond Luxury Retreat &middot; Παλαιόχωρα, Κρήτη &middot; 27–31 Ιουλίου</div>

</body>
</html>
